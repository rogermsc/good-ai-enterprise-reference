# Default PII Pattern Configuration
# Base patterns that apply globally

metadata:
  name: default
  version: "1.0.0"
  description: "Default PII patterns for common identifiers"

# Pattern definitions
# Order matters: more specific patterns should come first
patterns:
  - name: email
    description: "Email addresses"
    token_prefix: PII_EMAIL
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    priority: 10
    enabled: true

  - name: phone_international
    description: "International phone numbers"
    token_prefix: PII_PHONE
    pattern: '\b(?:\+\d{1,3}[-.\s]?)?\(?\d{2,3}\)?[-.\s]?\d{4,5}[-.\s]?\d{4}\b'
    priority: 20
    enabled: true

  - name: credit_card
    description: "Credit card numbers (major brands)"
    token_prefix: PII_CC
    pattern: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
    priority: 5
    enabled: true

  - name: ipv4
    description: "IPv4 addresses"
    token_prefix: PII_IP
    pattern: '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'
    priority: 30
    enabled: false  # Disabled by default, enable for security contexts

# Validation settings
validation:
  # Maximum number of PII items to redact per document
  max_redactions: 100
  # Whether to log when patterns are found (without the actual values)
  log_detections: true
