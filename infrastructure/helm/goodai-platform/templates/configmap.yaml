apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goodai-platform.fullname" . }}-config
  labels:
    {{- include "goodai-platform.api.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  MODEL_NAME: {{ .Values.config.modelName | quote }}
  RATE_LIMIT_REQUESTS_PER_MINUTE: {{ .Values.config.rateLimitRequestsPerMinute | quote }}
  RATE_LIMIT_TOKENS_PER_MINUTE: {{ .Values.config.rateLimitTokensPerMinute | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ include "goodai-platform.fullname" . | quote }}
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"
