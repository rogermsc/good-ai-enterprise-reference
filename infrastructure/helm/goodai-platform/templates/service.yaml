apiVersion: v1
kind: Service
metadata:
  name: {{ include "goodai-platform.fullname" . }}
  labels:
    {{- include "goodai-platform.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "goodai-platform.api.selectorLabels" . | nindent 4 }}
