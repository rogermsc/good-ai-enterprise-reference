---
# Secret template for sensitive configuration
# IMPORTANT: Do not commit actual secrets to version control
# Use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: goodai-api-secrets
  namespace: goodai-platform
  labels:
    app.kubernetes.io/name: goodai-api
    app.kubernetes.io/part-of: goodai
type: Opaque
stringData:
  # Database connection (use external secret management in production)
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres:5432/goodai"

  # Redis connection
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"

  # LLM API Keys (use external secret management in production)
  OPENAI_API_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"

  # JWT Secret
  JWT_SECRET_KEY: "CHANGE_ME_USE_STRONG_SECRET"

  # Encryption keys
  PII_ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_KEY_HERE"
