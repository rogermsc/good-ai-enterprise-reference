[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodai-sdk"
version = "1.0.0"
description = "Python SDK for the Good AI Enterprise Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Good AI Platform Team", email = "platform@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ai", "llm", "enterprise", "sdk", "api-client"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/example/goodai-platform"
Documentation = "https://docs.goodai.example.com/sdk"
Repository = "https://github.com/example/goodai-platform"

[tool.hatch.build.targets.sdist]
include = [
    "/goodai",
]

[tool.hatch.build.targets.wheel]
packages = ["goodai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
